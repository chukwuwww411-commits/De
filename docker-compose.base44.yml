services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
